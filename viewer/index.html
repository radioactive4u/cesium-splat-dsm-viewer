<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>splat-dsm-viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #note { position: absolute; top: 12px; left: 12px; z-index: 10; max-width: 420px; padding: 10px 12px; background: rgba(16, 18, 20, 0.82); color: #f2f2f2; font: 13px/1.4 sans-serif; }
    #note p { margin: 0; }
    #error { margin-top: 8px; color: #ffb4b4; }
  </style>
</head>
<body>
  <div id="note">
    <p id="caption">Stand-in tileset, Microsoft Redmond campus, Cesium ion 4547222, not project data.</p>
    <p id="error" hidden></p>
  </div>
  <div id="cesiumContainer"></div>
  <script>
    const errorEl = document.getElementById("error");

    function showError(error) {
      const message = error && error.message ? error.message : String(error);
      errorEl.hidden = false;
      errorEl.textContent = "Tileset failed to load: " + message;
      console.error(error);
    }

    (async function () {
      try {
        if (typeof Cesium === "undefined") {
          throw new Error("CesiumJS did not load.");
        }
        const viewer = new Cesium.Viewer("cesiumContainer", {
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
          baseLayerPicker: false,
          geocoder: false,
          animation: false,
          timeline: false
        });
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(4547222);
        viewer.scene.primitives.add(tileset);
        await viewer.zoomTo(tileset);
      } catch (error) {
        showError(error);
      }
    })();
  </script>
</body>
</html>
